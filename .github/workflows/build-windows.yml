name: Build Windows Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywin32

    - name: Build executable
      run: |
        pyinstaller trading_bot.spec --clean --noconfirm

    - name: Create artifact
      uses: actions/upload-artifact@v3
      with:
        name: TradingBotSimulator-Windows
        path: dist/TradingBotSimulator/

    - name: Install Inno Setup
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        choco install innosetup -y

    - name: Create installer
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        iscc installer.iss

    - name: Upload installer
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v3
      with:
        name: TradingBotSimulator-Installer
        path: Output/TradingBotSimulator-Setup.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: Output/TradingBotSimulator-Setup.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
