# Robotic Vacuum Mapper Configuration
# SLAM and Coverage Planning Settings for Windows 11

# Environment Settings
environment:
  grid_size: 200          # Grid size in cells (square grid)
  resolution: 0.05        # Resolution in meters per cell
  type: 'furniture'       # Environment type: empty, furniture, l_shape, maze, multi_room

# Robot Settings
robot:
  width: 0.3              # Robot width in meters
  max_speed: 0.3          # Maximum speed in m/s
  angular_speed: 1.0      # Maximum angular speed in rad/s

# SLAM Settings
slam:
  grid_size: [200, 200]   # Map grid size [width, height]
  resolution: 0.05        # Map resolution (meters per cell)
  origin: [0.0, 0.0]      # Origin point in world coordinates

# Particle Filter Settings (for localization)
particle_filter:
  enabled: true
  num_particles: 1000
  motion_noise_std: [0.1, 0.1, 0.05]  # [x, y, theta] noise std dev

# LiDAR Sensor Settings
lidar:
  enabled: true
  num_beams: 360          # Number of laser beams (360 = full circle)
  max_range: 5.0          # Maximum detection range in meters
  min_range: 0.05         # Minimum detection range in meters
  noise_std: 0.02         # Measurement noise standard deviation
  fov: 360.0              # Field of view in degrees

# Ultrasonic Sensor Settings
ultrasonic:
  enabled: true
  num_sensors: 8          # Number of sensors around robot
  max_range: 0.5          # Maximum range in meters
  min_range: 0.02         # Minimum range in meters
  noise_std: 0.01         # Measurement noise
  beam_width: 30.0        # Beam width in degrees

# Coverage Planning Settings
coverage:
  algorithm: 'boustrophedon'  # boustrophedon or spiral
  overlap: 0.05                # Path overlap in meters
  direction: 'horizontal'      # horizontal or vertical (for boustrophedon)

# Exploration Settings
exploration:
  max_steps: 500          # Maximum exploration steps
  collision_threshold: 0.15  # Collision detection threshold in meters
  step_size: 0.1          # Forward step size in meters
  turn_angle_min: 45      # Minimum turn angle in degrees
  turn_angle_max: 90      # Maximum turn angle in degrees

# Visualization Settings
visualization:
  real_time: true         # Enable real-time visualization
  update_interval: 100    # Update interval in milliseconds
  figsize: [12, 10]       # Figure size [width, height]
  save_results: false     # Save visualization to file
  output_path: 'results/vacuum_map.png'

# Logging Settings
logging:
  level: 'INFO'           # DEBUG, INFO, WARNING, ERROR
  log_file: null          # Log file path (null = console only)
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

# Performance Settings
performance:
  multithreading: false   # Enable multithreading (experimental)
  cache_size: 1000        # Cache size for map updates

# Windows 11 Specific Settings
windows:
  notifications: true     # Enable Windows notifications
  dark_mode: false        # Use dark mode visualization
  dpi_scaling: 1.0        # DPI scaling factor for high-DPI displays
